services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-meeting_app}
      MARIADB_USER: ${MARIADB_USER:-ari}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-ari_local_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ari_root_password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  python:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: unless-stopped
    expose:
      - "5001"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}

  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      python:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MARIADB_USER:-ari}:${MARIADB_PASSWORD:-ari_local_password}@db:3306/${MARIADB_DATABASE:-meeting_app}
      PYTHON_SERVICE_URL: http://python:5001
      NEXT_PUBLIC_SOCKET_SERVER_URL: ${NEXT_PUBLIC_SOCKET_SERVER_URL:-}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
      NEXT_PUBLIC_STREAM_API_KEY: ${NEXT_PUBLIC_STREAM_API_KEY:-}
      STREAM_SECRET_KEY: ${STREAM_SECRET_KEY:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - recordings_data:/app/public/recordings

volumes:
  mariadb_data:
  recordings_data: